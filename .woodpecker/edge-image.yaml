# Publish verified main builds for edge GitOps.
when:
  - event: push
    branch: main
  - event: manual
    branch: main

depends_on: [ci]

steps:
  - name: publish
    image: woodpeckerci/plugin-kaniko:2
    settings:
      registry: ghcr.io
      repo: hra42/edge-ip-echo
      username:
        from_secret: edge_ghcr_username
      password:
        from_secret: edge_ghcr_token
      dockerfile: Containerfile.echo-server
      tags:
        - main-${CI_PIPELINE_NUMBER}-${CI_COMMIT_SHA:0:7}
